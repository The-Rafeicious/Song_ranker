{% extends "base.html" %}

{% block title %}Bracket Tournament - Song Ranker{% endblock %}

{% block extra_css %}
<style>
    body { text-align: center; }
    h1 { margin-bottom: 10px; font-size: 3em; font-weight: 900; letter-spacing: -1px; text-shadow: 0 2px 10px rgba(29, 185, 84, 0.3); color: var(--color-song); }
    .subtitle-text { color: #888; margin-bottom: 40px; font-size: 1.1em; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

    /* --- SETUP PHASE --- */
    #setup-phase {
        max-width: 600px;
        margin: 0 auto;
        background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, #1e1e1e 100%);
        padding: 40px;
        border-radius: 16px;
        border: 1px solid #333;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
        text-align: left;
    }
    .form-group { margin-bottom: 25px; }
    .form-group label { display: block; color: #888; font-weight: 900; text-transform: uppercase; font-size: 0.9em; margin-bottom: 10px; }
    .form-select {
        width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333;
        background-color: #242424; color: white; font-size: 1.1em; outline: none;
        font-weight: bold; cursor: pointer; transition: border-color 0.2s;
    }
    .form-select:focus { border-color: var(--color-song); }

    .start-btn {
        background-color: var(--color-song); color: white; border: none; padding: 18px;
        font-size: 1.2em; border-radius: 30px; cursor: pointer; width: 100%; font-weight: 900;
        margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;
    }
    .start-btn:hover { background-color: #1ed760; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(29, 185, 84, 0.3); }
    .start-btn:disabled { background-color: #333; color: #666; cursor: not-allowed; transform: none; box-shadow: none; }

    /* --- MATCH PHASE --- */
    #match-phase { display: none; }

    .bracket-status {
        background-color: #1a1a1a; border: 1px solid #333; padding: 15px 30px;
        border-radius: 30px; display: inline-block; margin-bottom: 40px;
        font-weight: 900; color: white; font-size: 1.2em; text-transform: uppercase; letter-spacing: 2px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .matchup-container { display: flex; justify-content: center; align-items: center; gap: 50px; flex-wrap: wrap; }

    .song-card {
        background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, #1e1e1e 100%);
        padding: 25px; border-radius: 16px; width: 320px; border: 1px solid #333;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5); transition: transform 0.2s, border-color 0.2s;
    }
    .song-card:hover { transform: translateY(-5px); border-color: var(--color-song); box-shadow: 0 15px 30px var(--color-song-bg); }

    .cover-container {
        position: relative; width: 100%; height: 320px; margin-bottom: 25px;
        border-radius: 8px; overflow: hidden; background-color: #2a2a2a;
        cursor: pointer; box-shadow: 0 8px 16px rgba(0,0,0,0.6);
    }
    .cover-art { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.2s, transform 0.3s; }
    .cover-container:hover .cover-art { opacity: 0.4; transform: scale(1.05); }

    .play-overlay {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        font-size: 5em; color: rgba(255, 255, 255, 0.95); text-shadow: 0 4px 12px rgba(0,0,0,0.8);
        pointer-events: none; opacity: 0; transition: 0.2s;
    }
    .cover-container:hover .play-overlay, .play-overlay.playing { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

    .song-title { font-size: 1.6em; font-weight: 900; margin: 0 0 10px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { color: #b3b3b3; font-size: 1.1em; margin-bottom: 25px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vs-text { font-size: 3em; font-weight: 900; color: #444; margin: 0 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

    /* --- WINNER PHASE --- */
    #winner-phase { display: none; margin-top: 20px; animation: slideUp 0.5s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .champ-card {
        max-width: 500px; margin: 0 auto; background: linear-gradient(180deg, var(--color-song-bg) 0%, #1e1e1e 100%);
        padding: 40px; border-radius: 16px; border: 1px solid var(--color-song);
        box-shadow: 0 15px 40px rgba(29, 185, 84, 0.4); text-align: center;
    }
    .champ-cover { width: 300px; height: 300px; border-radius: 12px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin-bottom: 25px; border: 4px solid var(--color-song); }
    .champ-title { font-size: 2.2em; font-weight: 900; margin: 0 0 5px 0; }
    .champ-artist { color: #ccc; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; }
    .champ-elo { font-size: 1.5em; font-weight: 900; color: var(--color-song); }
</style>
{% endblock %}

{% block content %}

    <h1 id="page-title">Bracket Tournament</h1>
    <div class="subtitle-text" id="page-subtitle">A multi-round gauntlet to crown a champion.</div>

    <!-- 1. SETUP PHASE -->
    <div id="setup-phase">
        <div class="form-group">
            <label>Tournament Size</label>
            <select id="t-size" class="form-select">
                <option value="8">8 Tracks (Quarter-Finals)</option>
                <option value="16">16 Tracks (Sweet 16)</option>
                <option value="32">32 Tracks (Full Gauntlet)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tournament Scope</label>
            <select id="t-scope" class="form-select" onchange="toggleScopeInputs()">
                <option value="global">Global (Any Track)</option>
                <option value="artist">Artist Exclusive</option>
                <option value="album">Album Exclusive</option>
            </select>
        </div>

        <div class="form-group" id="artist-select-group" style="display: none;">
            <label>Select Artist</label>
            <select id="t-artist" class="form-select">
                {% for a in artists %}
                    <option value="{{ a.id }}">{{ a.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group" id="album-select-group" style="display: none;">
            <label>Select Album</label>
            <select id="t-album" class="form-select">
                {% for al in albums %}
                    <option value="{{ al.id }}">{{ al.title }}</option>
                {% endfor %}
            </select>
        </div>

        <button class="start-btn" id="generate-btn" onclick="generateTournament()">Generate Bracket</button>
        <div id="setup-error" style="color: #e22134; margin-top: 15px; font-weight: bold; text-align: center; display: none;"></div>
    </div>

    <!-- 2. MATCH PHASE -->
    <div id="match-phase">
        <div class="bracket-status" id="bracket-status">Round 1 - Match 1</div>

        <div class="matchup-container">
            <!-- Track 1 -->
            <div class="song-card">
                <div class="cover-container" onclick="toggleAudio('audio1', 'btn1')">
                    <img id="cover1" src="" class="cover-art">
                    <div class="play-overlay" id="btn1">▶</div>
                </div>
                <div class="song-title" id="title1"></div>
                <div class="song-artist" id="artist1"></div>
                <audio id="audio1" src=""></audio>
                <button class="start-btn" id="vote-btn-1" onclick="castVote(0)">Vote</button>
            </div>

            <div class="vs-text">VS</div>

            <!-- Track 2 -->
            <div class="song-card">
                <div class="cover-container" onclick="toggleAudio('audio2', 'btn2')">
                    <img id="cover2" src="" class="cover-art">
                    <div class="play-overlay" id="btn2">▶</div>
                </div>
                <div class="song-title" id="title2"></div>
                <div class="song-artist" id="artist2"></div>
                <audio id="audio2" src=""></audio>
                <button class="start-btn" id="vote-btn-2" onclick="castVote(1)">Vote</button>
            </div>
        </div>
    </div>

    <!-- 3. WINNER PHASE -->
    <div id="winner-phase">
        <div style="font-size: 3em; margin-bottom: 20px;">🏆</div>
        <div class="champ-card">
            <h2 style="color: var(--color-song); margin-top: 0; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;">Tournament Champion</h2>
            <img id="champ-cover" src="" class="champ-cover">
            <div class="champ-title" id="champ-title"></div>
            <div class="champ-artist" id="champ-artist"></div>
            <div class="champ-elo" id="champ-elo"></div>
        </div>
        <button class="start-btn" onclick="location.reload()" style="max-width: 300px; margin-top: 40px;">Play Again</button>
    </div>


<script>
    // Audio Logic
    const audio1 = document.getElementById('audio1');
    const audio2 = document.getElementById('audio2');
    const volumeSlider = document.getElementById('global-volume');

    if (volumeSlider) {
        volumeSlider.addEventListener('input', (e) => {
            audio1.volume = e.target.value;
            audio2.volume = e.target.value;
        });
    }

    function toggleAudio(targetId, btnId) {
        const currentAudio = document.getElementById(targetId);
        const currentBtn = document.getElementById(btnId);
        const otherAudio = targetId === 'audio1' ? audio2 : audio1;
        const otherBtn = targetId === 'audio1' ? document.getElementById('btn2') : document.getElementById('btn1');

        if (!currentAudio.src || currentAudio.src.endsWith('null')) return;

        if (currentAudio.paused) {
            if (!otherAudio.paused) {
                otherAudio.pause();
                otherBtn.innerText = '▶';
                otherBtn.classList.remove('playing');
            }
            currentAudio.play();
            currentBtn.innerText = '⏸';
            currentBtn.classList.add('playing');
        } else {
            currentAudio.pause();
            currentBtn.innerText = '▶';
            currentBtn.classList.remove('playing');
        }
    }

    audio1.addEventListener('ended', () => { document.getElementById('btn1').innerText = '▶'; document.getElementById('btn1').classList.remove('playing'); });
    audio2.addEventListener('ended', () => { document.getElementById('btn2').innerText = '▶'; document.getElementById('btn2').classList.remove('playing'); });

    // UI Toggles
    function toggleScopeInputs() {
        const scope = document.getElementById('t-scope').value;
        document.getElementById('artist-select-group').style.display = scope === 'artist' ? 'block' : 'none';
        document.getElementById('album-select-group').style.display = scope === 'album' ? 'block' : 'none';
    }

    // Tournament State
    let tParams = { size: 8, scope: 'global', scope_id: null };
    let matchups = [];       // Array of current round pairs: [[trackA, trackB], ...]
    let nextRound = [];      // Array of tracks that won this round
    let currentMatchIndex = 0;
    let roundNum = 1;

    // Mathematical Bracket Seeding (Prevents #1 and #2 from meeting until finals)
    function generateSeeding(numTeams) {
        let rounds = Math.log2(numTeams);
        let bracket = [1, 2];
        for (let r = 1; r < rounds; r++) {
            let nextBracket = [];
            let sum = Math.pow(2, r + 1) + 1;
            for (let i = 0; i < bracket.length; i++) {
                nextBracket.push(bracket[i]);
                nextBracket.push(sum - bracket[i]);
            }
            bracket = nextBracket;
        }
        return bracket.map(seed => seed - 1); // 0-indexed for array access
    }

    async function generateTournament() {
        const btn = document.getElementById('generate-btn');
        const err = document.getElementById('setup-error');

        btn.disabled = true;
        btn.innerText = "Building Bracket...";
        err.style.display = "none";

        tParams.size = parseInt(document.getElementById('t-size').value);
        tParams.scope = document.getElementById('t-scope').value;
        if (tParams.scope === 'artist') tParams.scope_id = document.getElementById('t-artist').value;
        if (tParams.scope === 'album') tParams.scope_id = document.getElementById('t-album').value;

        const url = `/api/generate_bracket?size=${tParams.size}&scope=${tParams.scope}&scope_id=${tParams.scope_id || ''}`;

        try {
            const res = await fetch(url);
            const data = await res.json();

            if (data.error) {
                err.innerText = data.error;
                err.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Generate Bracket";
                return;
            }

            // Apply standard bracket seeding to the sorted tracks
            const tracks = data.tracks;
            const seedOrder = generateSeeding(tParams.size);

            matchups = [];
            for (let i = 0; i < seedOrder.length; i += 2) {
                matchups.push([tracks[seedOrder[i]], tracks[seedOrder[i+1]]]);
            }

            document.getElementById('setup-phase').style.display = "none";
            document.getElementById('page-subtitle').style.display = "none";
            document.getElementById('match-phase').style.display = "block";

            renderMatch();

        } catch (e) {
            err.innerText = "Network error occurred.";
            err.style.display = "block";
            btn.disabled = false;
            btn.innerText = "Generate Bracket";
        }
    }

    function getRoundName(totalRemaining) {
        if (totalRemaining === 2) return "Grand Final";
        if (totalRemaining === 4) return "Semi-Finals";
        if (totalRemaining === 8) return "Quarter-Finals";
        return `Round ${roundNum}`;
    }

    function renderMatch() {
        const match = matchups[currentMatchIndex];
        const t1 = match[0];
        const t2 = match[1];

        // Update bracket text
        const totalTracksRemaining = matchups.length * 2;
        const roundText = getRoundName(totalTracksRemaining);
        document.getElementById('bracket-status').innerText = `${roundText} - Match ${currentMatchIndex + 1}/${matchups.length}`;

        // Populate Cards
        document.getElementById('cover1').src = t1.cover_url;
        document.getElementById('title1').innerText = t1.title;
        document.getElementById('artist1').innerText = t1.artist;
        audio1.src = t1.audio_url || "";
        document.getElementById('btn1').style.opacity = t1.audio_url ? "0" : "0.5";
        document.getElementById('btn1').innerText = t1.audio_url ? "▶" : "No Audio";

        document.getElementById('cover2').src = t2.cover_url;
        document.getElementById('title2').innerText = t2.title;
        document.getElementById('artist2').innerText = t2.artist;
        audio2.src = t2.audio_url || "";
        document.getElementById('btn2').style.opacity = t2.audio_url ? "0" : "0.5";
        document.getElementById('btn2').innerText = t2.audio_url ? "▶" : "No Audio";

        if (volumeSlider) { audio1.volume = volumeSlider.value; audio2.volume = volumeSlider.value; }

        document.getElementById('vote-btn-1').disabled = false;
        document.getElementById('vote-btn-2').disabled = false;
    }

    async function castVote(winnerIndex) {
        document.getElementById('vote-btn-1').disabled = true;
        document.getElementById('vote-btn-2').disabled = true;
        audio1.pause(); audio2.pause();
        document.getElementById('btn1').innerText = '▶';
        document.getElementById('btn2').innerText = '▶';
        document.getElementById('btn1').classList.remove('playing');
        document.getElementById('btn2').classList.remove('playing');

        const match = matchups[currentMatchIndex];
        const winner = match[winnerIndex];
        const loser = match[winnerIndex === 0 ? 1 : 0];

        // Send API Vote asynchronously
        fetch('/api/tournament_vote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ winner_id: winner.id, loser_id: loser.id })
        });

        // Progress Tournament State Locally
        nextRound.push(winner);
        currentMatchIndex++;

        if (currentMatchIndex >= matchups.length) {
            // Round is over
            if (nextRound.length === 1) {
                return finishTournament(nextRound[0]);
            }

            // Build next round matchups sequentially (winners of adjacent matches play each other)
            matchups = [];
            for (let i = 0; i < nextRound.length; i += 2) {
                matchups.push([nextRound[i], nextRound[i+1]]);
            }
            nextRound = [];
            currentMatchIndex = 0;
            roundNum++;
        }

        renderMatch();
    }

    async function finishTournament(champion) {
        document.getElementById('match-phase').style.display = "none";
        document.getElementById('page-title').innerText = "Tournament Complete";

        // Log the champion
        await fetch('/api/tournament_complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ champion_id: champion.id, size: tParams.size, scope: tParams.scope, scope_id: tParams.scope_id })
        });

        document.getElementById('champ-cover').src = champion.cover_url;
        document.getElementById('champ-title').innerText = champion.title;
        document.getElementById('champ-artist').innerText = champion.artist;
        document.getElementById('champ-elo').innerText = "Final Elo: " + parseInt(champion.elo_score);

        document.getElementById('winner-phase').style.display = "block";
    }
</script>
{% endblock %}
