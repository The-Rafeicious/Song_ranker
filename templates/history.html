<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match History</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding-bottom: 50px;
        }
        .navbar {
            background-color: #1e1e1e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            margin-bottom: 40px;
        }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .nav-left a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }
        .nav-left a:hover, .nav-left .active { color: #1db954; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .search-form { display: flex; }
        .search-input {
            padding: 8px 15px;
            border-radius: 20px 0 0 20px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            width: 200px;
        }
        .search-btn {
            padding: 8px 20px;
            border-radius: 0 20px 20px 0;
            border: none;
            background-color: #1db954;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        h1 { margin-bottom: 30px; }
        .history-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }
        .history-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 10px;
            border-bottom: 1px solid #333;
        }
        .history-row:last-child { border-bottom: none; }

        .side {
            display: flex;
            align-items: center;
            width: 45%;
        }
        .winner-side { justify-content: flex-end; text-align: right; }
        .loser-side { justify-content: flex-start; text-align: left; opacity: 0.6; }

        .cover-art {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            background-color: #2a2a2a;
            margin: 0 15px;
        }
        .song-text {
            overflow: hidden;
            white-space: nowrap;
        }
        .title {
            font-size: 1.1em;
            font-weight: bold;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        .winner-text { color: #1db954; }
        .artist {
            color: #b3b3b3;
            font-size: 0.85em;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        .vs-badge {
            background-color: #333;
            color: #888;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <a href="/">Home</a>
            <a href="/blind">Blind Mode</a>
            <a href="/trivia">Trivia</a>
            <a href="/leaderboard">Top 20</a>
            <a href="/artists">Artists</a>
            <a href="/albums">Albums</a>
            <a href="/tiers">Tier List</a>
            <a href="/trivia_stats">Trivia Stats</a>
            <a href="/history" class="active">History</a>
            <a href="/dev/login">Dev</a>
        </div>
        <div class="nav-right">
            <form action="/search" method="GET" class="search-form">
                <input type="text" name="q" class="search-input" placeholder="Search songs, artists...">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>
    </div>

    <h1>Recent Match History</h1>

    <div class="history-container">
        {% for match in history %}
        <div class="history-row">

            <!-- Winner Side -->
            <div class="side winner-side">
                <div class="song-text">
                    <div class="title winner-text" title="{{ match.winner_title }}">🏆 {{ match.winner_title }}</div>
                    <div class="artist">{{ match.winner_artist }}</div>
                </div>
                <img src="{{ match.winner_cover }}" alt="Cover" class="cover-art">
            </div>

            <div class="vs-badge">VS</div>

            <!-- Loser Side -->
            <div class="side loser-side">
                <img src="{{ match.loser_cover }}" alt="Cover" class="cover-art">
                <div class="song-text">
                    <div class="title" title="{{ match.loser_title }}">{{ match.loser_title }}</div>
                    <div class="artist">{{ match.loser_artist }}</div>
                </div>
            </div>

        </div>
        {% else %}
        <div style="text-align: center; color: #888; padding: 30px 0;">
            No match history found. Start voting!
        </div>
        {% endfor %}
    </div>

</body>
</html>
