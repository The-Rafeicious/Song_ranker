{% extends 'base.html' %}
{% block title %}Query · Song Ranker{% endblock %}
{% block page_kind %}mode_query{% endblock %}
{% block content %}
<section data-mode-query {% if session.get("is_admin") %}data-query-admin{% endif %} class="query-page">
<header class="ranking-heading"><h1 class="ranking-title ranking-title-query"><span>Query</span></h1></header><div data-query-entity></div>
<form data-query-form class="panel"><div data-query-controls></div><p data-query-error role="alert"></p><div class="query-actions"><button type="submit">Apply query</button><button type="button" data-query-reset>Reset</button><button type="button" data-query-save disabled>Save preset</button>{% if session.get("is_admin") %}<a class="btn" href="/dev/tools/query-presets">Manage presets</a>{% endif %}</div></form>
<p data-preset-status role="status"></p>
<dialog class="query-preset-dialog" aria-labelledby="query-preset-heading">
  <form data-query-save-form>
    <h2 id="query-preset-heading">Save Query preset</h2>
    <label>Preset name<input name="name" required maxlength="80" autofocus></label>
    <p data-preset-error role="alert"></p>
    <div class="query-actions">
      <button type="submit">Save</button>
      <button type="button" data-preset-cancel>Cancel</button>
    </div>
  </form>
</dialog>
<div data-query-results aria-live="polite"><p>Loading query options…</p></div>
<noscript>This query workspace needs JavaScript. <a href="/leaderboard">Browse song rankings</a>.</noscript>
</section>
{% endblock %}
