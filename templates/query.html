{% extends 'base.html' %}
{% block title %}Query · Song Ranker{% endblock %}
{% block page_kind %}mode_query{% endblock %}
{% block content %}
<section data-mode-query class="query-page">
<header class="query-header"><h1 class="wordmark">Query</h1><nav class="query-entities" data-query-entity aria-label="Query category"></nav></header>
<form data-query-form class="panel"><div data-query-controls></div><p data-query-error role="alert"></p><div class="query-actions"><button type="submit">Apply query</button><button type="button" data-query-reset>Reset</button></div></form>
<div data-query-results aria-live="polite"><p>Loading query options…</p></div>
<noscript>This query workspace needs JavaScript. <a href="/leaderboard">Browse song rankings</a>.</noscript>
</section>
{% endblock %}
