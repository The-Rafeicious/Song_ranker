{% extends 'base.html' %}
{% block title %}System Access · Song Ranker{% endblock %}
{% block content %}
<section class="panel login-panel">
  <h1 class="song">System Access</h1>
  {% if error %}<p class="error" role="alert">{{error}}</p>{% endif %}
  <form action="/dev/login" method="post">
    <div class="field"><label for="pin">PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required autofocus></div>
    <button type="submit" class="btn primary">Unlock</button>
  </form>
  <a class="muted" href="/">← Home</a>
</section>
{% endblock %}
