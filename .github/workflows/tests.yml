name: Song Ranker tests
on:
  pull_request:
  push:
    branches: [main, New-modes-test]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install --no-save --no-package-lock jsdom@26 playwright-core@1.58.2
      - name: Python regression
        run: python -m unittest discover -s tests -v
      - name: JavaScript regression
        if: always()
        run: |
          for test in tests/test_*.js; do
            case "$test" in
              tests/test_dev_pages.js) python tools/validate_dev_pages.py ;;
              *) node "$test" ;;
            esac || exit 1
          done

      - name: Vibe Map browser integration
        if: always()
        run: python tools/validate_vibe_page.py
      - name: Vibe Map review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-map-screenshots
          path: artifacts/vibe-map/*.png
          if-no-files-found: ignore
