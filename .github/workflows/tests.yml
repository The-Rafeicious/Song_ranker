name: Song Ranker tests
on:
  pull_request:
  push:
    branches: [codex/v5.1.2.2-connecting-bar]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install --no-save --no-package-lock jsdom@26
      - name: Python regression
        run: python -m unittest discover -s tests -v
      - name: JavaScript regression
        if: always()
        run: |
          for test in tests/test_*.js; do node "$test" || exit 1; done
