name: Song Ranker tests
on:
  pull_request:
  push:
    branches: [main, New-modes-test]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Source and asset ownership
        run: python tools/check.py structure
      - name: Function documentation
        run: python tools/check.py docs
      - name: Python regression
        run: python tools/check.py python
      - name: JavaScript and served-page regression
        if: always()
        run: python tools/check.py javascript
      - name: Chromium integration
        if: always()
        run: python tools/check.py browser
      - name: Browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: song-ranker-screenshots
          path: artifacts/vibe-map/*.png
          if-no-files-found: ignore
